<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Read a classic interview question and diagnose the underlying algorithm pattern, with an optional 5, 10 or 15 minute timer to build speed.">
    <title>Pattern Recognition Practice</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Hide scrollbar for the hover sidebar but allow scrolling */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Cheat sheet expands on tap (any device) and on hover (mouse only).
           Hover alone is unreachable on touch screens. */
        #cheat-sheet.cheat-open {
            height: 16rem;
        }

        #cheat-sheet.cheat-open .cheat-body {
            opacity: 1;
        }

        @media (hover: hover) and (pointer: fine) {
            #cheat-sheet:hover {
                height: 16rem;
            }

            #cheat-sheet:hover .cheat-body {
                opacity: 1;
            }
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen lg:h-screen flex flex-col lg:overflow-hidden relative selection:bg-indigo-100 selection:text-indigo-900">

    <div class="bg-white border-b border-gray-100 px-4 sm:px-6 py-3 sm:py-4 flex flex-col sm:flex-row gap-2 sm:gap-4 sm:justify-between sm:items-center shrink-0 shadow-sm z-50 sticky top-0">
        <h1 class="font-bold text-lg sm:text-xl text-gray-700 flex items-center gap-2 whitespace-nowrap">
            <span>📚</span>
            <a href="index.html" class="hover:text-indigo-500 transition-colors">LC Study Hub</a>
        </h1>
        <div class="flex gap-3 sm:gap-5 text-xs sm:text-sm font-semibold text-gray-500 items-center overflow-x-auto no-scrollbar -mx-4 px-4 sm:mx-0 sm:px-0">
            <a href="python.html" class="hover:text-indigo-500 transition-colors whitespace-nowrap shrink-0">Python Syntax</a>
            <a href="patterns.html" class="hover:text-indigo-500 transition-colors whitespace-nowrap shrink-0">Pattern Practice</a>
            <a href="recognition.html" aria-current="page" class="text-indigo-700 bg-indigo-100 px-3 py-1 rounded-full whitespace-nowrap shrink-0">Pattern Recognition</a>
        </div>
    </div>

    <div class="bg-white border-b border-gray-200 px-4 sm:px-6 py-3 sm:py-4 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 shrink-0 shadow-sm z-10">
        <div class="flex items-center gap-2 sm:gap-4 flex-wrap">
            <h2 class="font-bold text-lg sm:text-xl text-gray-700">Pattern Recognition</h2>
            <div class="h-6 w-px bg-gray-300 hidden sm:block"></div>
            <div class="flex gap-2 text-sm">
                <button onclick="startTimer(5)"
                    class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 text-gray-700 hover:text-indigo-700 rounded transition-colors">5
                    min</button>
                <button onclick="startTimer(10)"
                    class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 text-gray-700 hover:text-indigo-700 rounded transition-colors">10
                    min</button>
                <button onclick="startTimer(15)"
                    class="px-3 py-1 bg-gray-100 hover:bg-indigo-100 text-gray-700 hover:text-indigo-700 rounded transition-colors">15
                    min</button>
            </div>
            <div id="timer-display" class="font-mono text-lg font-bold text-gray-400 sm:ml-2">--:--</div>
        </div>

        <div class="flex gap-4 font-bold text-lg shrink-0 justify-end">
            <div class="text-green-600">✅ <span id="score-correct">0</span></div>
            <div class="text-red-500">❌ <span id="score-missed">0</span></div>
        </div>
    </div>

    <div class="flex-1 flex lg:overflow-y-auto p-4 sm:p-6 pb-16 sm:pb-16 relative z-0">
        <div class="max-w-3xl w-full m-auto flex flex-col gap-6" id="app-container">

            <div class="bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200">
                <div class="flex justify-between items-start gap-3 mb-4">
                    <h2 id="q-title" class="text-xl sm:text-2xl font-bold text-gray-800">Loading...</h2>
                    <span id="q-difficulty"
                        class="px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider shrink-0"></span>
                </div>
                <div id="q-description"
                    class="text-gray-600 leading-relaxed whitespace-pre-wrap bg-blue-50 p-4 rounded-md border border-blue-100 font-sans">
                </div>
            </div>

            <button id="reveal-btn" onclick="revealAnswer()"
                class="w-full py-4 bg-indigo-600 text-white font-bold text-lg rounded-xl hover:bg-indigo-700 transition-colors shadow-sm">
                Reveal Pattern
            </button>

            <div id="reveal-section" class="hidden flex-col gap-4">
                <div class="bg-green-50 border border-green-200 p-4 sm:p-6 rounded-xl shadow-sm">
                    <h3 class="text-sm font-bold text-green-800 uppercase tracking-wider mb-1">Correct Pattern</h3>
                    <p id="r-pattern" class="text-xl sm:text-2xl font-bold text-green-700 mb-3"></p>

                    <h3 class="text-sm font-bold text-green-800 uppercase tracking-wider mb-1 mt-4">Why? (The Clues)
                    </h3>
                    <p id="r-clues" class="text-green-900"></p>

                    <div class="mt-4 pt-4 border-t border-green-200">
                        <a id="r-link" href="#" target="_blank"
                            class="text-indigo-600 hover:text-indigo-800 font-semibold text-sm flex items-center gap-1">
                            View on LeetCode →
                        </a>
                    </div>
                </div>

                <div class="flex gap-4 mt-2">
                    <button onclick="recordAnswer(false)"
                        class="flex-1 py-3 bg-red-100 text-red-700 hover:bg-red-200 font-bold rounded-xl transition-colors">
                        Missed It 👎
                    </button>
                    <button onclick="recordAnswer(true)"
                        class="flex-1 py-3 bg-green-500 text-white hover:bg-green-600 font-bold rounded-xl transition-colors shadow-sm">
                        Got It 👍
                    </button>
                </div>
            </div>

        </div>
        <div id="end-screen" class="hidden max-w-3xl w-full m-auto bg-white p-6 sm:p-8 rounded-xl shadow-sm border border-gray-200 text-center">
            <h2 class="text-2xl sm:text-3xl font-bold text-gray-800 mb-2">Time's Up!</h2>
            <p class="text-gray-600 mb-6">Here is how you did this session:</p>
            <div class="flex justify-center gap-8 mb-8">
                <div class="text-center">
                    <div class="text-4xl font-black text-green-600" id="final-correct">0</div>
                    <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mt-1">Correct</div>
                </div>
                <div class="text-center">
                    <div class="text-4xl font-black text-red-500" id="final-missed">0</div>
                    <div class="text-sm font-bold text-gray-500 uppercase tracking-wider mt-1">Missed</div>
                </div>
            </div>
            <button onclick="location.reload()"
                class="px-8 py-3 bg-indigo-600 text-white font-bold rounded-xl hover:bg-indigo-700 transition-colors">
                Start New Session
            </button>
        </div>
    </div>

    <div id="cheat-sheet"
        class="fixed bottom-0 left-0 w-full h-8 bg-gray-900 text-white transition-all duration-300 z-50 flex flex-col overflow-hidden shadow-2xl border-t border-gray-700">
        <button type="button" onclick="toggleCheatSheet()" id="cheat-sheet-toggle" aria-expanded="false"
            class="h-8 shrink-0 flex items-center justify-center bg-gray-800 border-b border-gray-700 w-full cursor-pointer">
            <span class="whitespace-nowrap text-xs font-bold text-gray-400 tracking-widest uppercase">
                <span class="sm:hidden">Tap for Patterns</span>
                <span class="hidden sm:inline">Hover for Patterns</span>
            </span>
        </button>
        <div

            <ul id="cheat-sheet-list" class="grid grid-cols-2 md:grid-cols-4 gap-x-4 gap-y-2 text-sm text-gray-300">
            </ul>
        </div>
    </div>

                description: "Given an m x n matrix, return all elements of the matrix in spiral order."
            },
            {
                title: "Rotate Image", difficulty: "Medium", patternId: "matrix-manipulation", url: "https://leetcode.com/problems/rotate-image/",
                clues: "In-place matrix mutation with a two-step trick: transpose the matrix (swap across the diagonal), then reverse each row.",
                description: "You are given an n x n 2D matrix representing an image. Rotate the image by 90 degrees clockwise. You have to modify the input matrix in-place."
            },
            {
                title: "Number of 1 Bits", difficulty: "Easy", patternId: "bit-manipulation", url: "https://leetcode.com/problems/number-of-1-bits/",
                clues: "A classic bit trick: n & (n - 1) clears the lowest set bit, so counting how many times you can do that before n reaches zero gives the answer.",
                description: "Write a function that takes the binary representation of a positive integer and returns the number of set bits it has (also known as the Hamming weight)."
            },
            {
                title: "Counting Bits", difficulty: "Easy", patternId: "bit-manipulation", url: "https://leetcode.com/problems/counting-bits/",
                clues: "Reuse smaller answers: dropping the last bit gives a number already solved, so bits[i] = bits[i >> 1] + (i & 1).",
                description: "Given an integer n, return an array ans of length n + 1 such that for each i, ans[i] is the number of 1's in the binary representation of i."
            },
            {
                title: "Reverse Bits", difficulty: "Easy", patternId: "bit-manipulation", url: "https://leetcode.com/problems/reverse-bits/",
                clues: "Walk all 32 bits: shift the result left, OR in the lowest bit of the input, then shift the input right. Pure shifting and masking.",
                description: "Reverse bits of a given 32 bits unsigned integer."
            },
            {
                title: "Sum of Two Integers", difficulty: "Medium", patternId: "bit-manipulation", url: "https://leetcode.com/problems/sum-of-two-integers/",
                clues: "Addition without the '+' operator means simulating an adder: XOR gives the sum without carries, AND shifted left gives the carry, and you repeat until the carry is zero.",
                description: "Given two integers a and b, return the sum of the two integers without using the operators + and -."
            }

        ];

        // --- 2. GAME STATE & LOGIC ---
        let unplayedQuestions = [];
        let currentQuestion = null;

        let correctCount = 0;
        let missedCount = 0;

        let timerInterval = null;
        let timeRemaining = 0;
        let isGameActive = false;

        // Populate Cheat Sheet on load
        // Tap target for the cheat sheet; mouse users still get the hover behaviour via CSS.
        function toggleCheatSheet() {
            const sheet = document.getElementById('cheat-sheet');
            const open = sheet.classList.toggle('cheat-open');
            document.getElementById('cheat-sheet-toggle').setAttribute('aria-expanded', open);
        }

        function initCheatSheet() {
            const list = document.getElementById('cheat-sheet-list');
            Object.values(patternsMap).forEach(patternName => {
                const li = document.createElement('li');
                li.className = "py-1 border-b border-gray-800 last:border-0";
                li.innerText = patternName;
                list.appendChild(li);
            });
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Pulls a random question that hasn't been played yet
        function nextQuestion() {
            if (unplayedQuestions.length === 0) {
                // Refill and shuffle if they play through all of them
                unplayedQuestions = [...questionsData];
                shuffleArray(unplayedQuestions);
            }

            currentQuestion = unplayedQuestions.pop();

            // UI Updates
            document.getElementById('q-title').innerText = currentQuestion.title;
            document.getElementById('q-description').innerText = currentQuestion.description;

            const diffEl = document.getElementById('q-difficulty');
            diffEl.innerText = currentQuestion.difficulty;
            // Set Badge color based on difficulty
            diffEl.className = "px-3 py-1 text-xs font-bold rounded-full uppercase tracking-wider shrink-0 ";
            if (currentQuestion.difficulty === "Easy") diffEl.className += "bg-green-100 text-green-700";
            else if (currentQuestion.difficulty === "Medium") diffEl.className += "bg-yellow-100 text-yellow-700";
            else diffEl.className += "bg-red-100 text-red-700";

            // Reset UI States
            document.getElementById('reveal-btn').classList.remove('hidden');
            document.getElementById('reveal-section').classList.add('hidden');
            document.getElementById('reveal-section').classList.remove('flex');
        }

        // Shows the answer
        function revealAnswer() {
            document.getElementById('reveal-btn').classList.add('hidden');
            document.getElementById('reveal-section').classList.remove('hidden');
            document.getElementById('reveal-section').classList.add('flex');

            document.getElementById('r-pattern').innerText = patternsMap[currentQuestion.patternId];
            document.getElementById('r-clues').innerText = currentQuestion.clues;
            document.getElementById('r-link').href = currentQuestion.url;
        }

        // Records the score and moves to next
        function recordAnswer(isCorrect) {
            if (!isGameActive) return; // Prevent scoring if timer ran out

            if (isCorrect) {
                correctCount++;
                document.getElementById('score-correct').innerText = correctCount;
            } else {
                missedCount++;
                document.getElementById('score-missed').innerText = missedCount;
            }
            nextQuestion();
        }

        // --- 3. TIMER LOGIC ---
        function startTimer(minutes) {
            clearInterval(timerInterval);

            // Reset Game
            correctCount = 0;
            missedCount = 0;
            document.getElementById('score-correct').innerText = "0";
            document.getElementById('score-missed').innerText = "0";

            document.getElementById('app-container').classList.remove('hidden');
            document.getElementById('end-screen').classList.add('hidden');

            timeRemaining = minutes * 60;
            isGameActive = true;
            updateTimerDisplay();

            unplayedQuestions = [...questionsData];
            shuffleArray(unplayedQuestions);
            nextQuestion();

            timerInterval = setInterval(() => {
                timeRemaining--;
                updateTimerDisplay();

                if (timeRemaining <= 0) {
                    endSession();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            const m = Math.floor(timeRemaining / 60).toString().padStart(2, '0');
            const s = (timeRemaining % 60).toString().padStart(2, '0');
            const display = document.getElementById('timer-display');
            display.innerText = `${m}:${s}`;

            if (timeRemaining < 60 && timeRemaining > 0) {
                display.classList.add('text-red-500');
                display.classList.remove('text-gray-400');
            } else {
                display.classList.add('text-gray-400');
                display.classList.remove('text-red-500');
            }
        }

        function endSession() {
            clearInterval(timerInterval);
            isGameActive = false;
            document.getElementById('timer-display').innerText = "00:00";

            // Hide main app, show end screen
            document.getElementById('app-container').classList.add('hidden');
            const endScreen = document.getElementById('end-screen');
            endScreen.classList.remove('hidden');

            document.getElementById('final-correct').innerText = correctCount;
            document.getElementById('final-missed').innerText = missedCount;
        }

        // Initialize on load
        window.onload = () => {
            initCheatSheet();
            // Start default practice mode (no timer constraint initially, or start 5m)
            unplayedQuestions = [...questionsData];
            shuffleArray(unplayedQuestions);
            isGameActive = true; // allow scoring without timer for freeplay
            nextQuestion();
        };
    </script>
</body>
